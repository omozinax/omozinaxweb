<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matet – Sierra de Espadán, Castellón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --verde: #3B6D11;
    --verde-claro: #639922;
    --verde-suave: #EAF3DE;
    --tierra: #854F0B;
    --tierra-claro: #FAC775;
    --tierra-suave: #FAEEDA;
    --gris-oscuro: #2C2C2A;
    --gris-medio: #5F5E5A;
    --gris-claro: #F1EFE8;
    --blanco: #FFFDF8;
    --bici-naranja: #E65F2B; /* Color especial para la sección ciclista */
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--blanco);
    color: var(--gris-oscuro);
    font-weight: 300;
    line-height: 1.8;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,253,248,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #e0ddd5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem;
    height: 60px;
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--verde);
    letter-spacing: 0.02em;
  }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gris-medio);
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--verde); }
  .nav-links a.nav-bici { color: var(--bici-naranja); font-weight: 700; }
  .nav-links a.nav-bici:hover { color: #b53d10; }

  /* HERO */
  .hero {
    margin-top: 60px;
    height: calc(100vh - 60px);
    min-height: 500px;
    position: relative;
    overflow: hidden;
    display: flex; align-items: flex-end;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.55) 100%),
      url('pueblo.jpg') center/cover no-repeat;
  }
  .hero-content {
    position: relative; z-index: 2;
    padding: 3rem 4rem;
    max-width: 700px;
  }
  .hero-eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--tierra-claro);
    margin-bottom: 1rem;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 7vw, 5.5rem);
    font-weight: 700;
    color: #fff;
    line-height: 1.05;
    margin-bottom: 1rem;
  }
  .hero-sub {
    font-size: 1.05rem;
    color: rgba(255,255,255,0.82);
    font-weight: 300;
    max-width: 480px;
    margin-bottom: 2rem;
  }
  .hero-btn {
    display: inline-block;
    text-decoration: none;
    padding: 0.75rem 2rem;
    border: 1.5px solid rgba(255,255,255,0.7);
    color: #fff;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s;
  }
  .hero-btn:hover { background: rgba(255,255,255,0.15); border-color: #fff; }

  /* SECCIONES GENERALES */
  section { padding: 5rem 2.5rem; }
  .container { max-width: 1000px; margin: 0 auto; }

  .section-label {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--verde-claro);
    margin-bottom: 0.6rem;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    font-weight: 700;
    line-height: 1.2;
    color: var(--gris-oscuro);
    margin-bottom: 1.5rem;
  }
  .section-title em {
    font-style: italic;
    color: var(--verde);
  }
  .divider {
    width: 48px; height: 2px;
    background: var(--verde-claro);
    margin-bottom: 2rem;
  }

  /* INTRO */
  #intro { background: var(--blanco); }
  .intro-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    align-items: center;
  }
  .intro-text p { color: var(--gris-medio); margin-bottom: 1.2rem; font-size: 1rem; }
  .intro-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  .stat-card {
    background: var(--gris-claro);
    padding: 1.5rem;
    border-left: 3px solid var(--verde-claro);
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--verde);
    line-height: 1;
    margin-bottom: 0.3rem;
  }
  .stat-label {
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gris-medio);
  }

  /* HISTORIA */
  #historia { background: var(--gris-claro); }
  .historia-content {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 4rem;
    align-items: start;
  }
  .historia-timeline { position: relative; padding-left: 1.5rem; }
  .historia-timeline::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--verde-claro), transparent);
  }
  .timeline-item { margin-bottom: 2.5rem; position: relative; }
  .timeline-dot {
    position: absolute; left: -1.9rem; top: 0.3rem;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--verde-claro);
    border: 2px solid var(--blanco);
  }
  .timeline-year {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--verde-claro);
    margin-bottom: 0.3rem;
  }
  .timeline-text { font-size: 0.95rem; color: var(--gris-medio); }
  .historia-main p { color: var(--gris-medio); margin-bottom: 1.2rem; }

  /* LUGARES */
  #lugares { background: var(--blanco); }
  .lugares-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
    margin-top: 3
