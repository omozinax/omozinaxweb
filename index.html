<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matet — Sierra de Espadán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --oliva:#3B5E0F;
  --oliva-med:#527A18;
  --oliva-claro:#A8C66D;
  --oliva-palido:#EBF2DA;
  --tierra:#7A3B0A;
  --tierra-claro:#D4895A;
  --arena:#FAF6EE;
  --pergamino:#F3EDE0;
  --carbon:#1C1A16;
  --grafito:#3A3830;
  --ceniza:#8A8880;
  --humo:#C8C5BC;
  --blanco:#FFFCF5;
  --naranja-bici:#D94F1A;
  --negro-noche:#111009;
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Jost',sans-serif;background:var(--arena);color:var(--carbon);font-weight:300;line-height:1.75;overflow-x:hidden}

/* ── CURSOR ── */
body{cursor:crosshair}
a,button{cursor:pointer}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--pergamino)}
::-webkit-scrollbar-thumb{background:var(--oliva-med)}

/* ══════════════ NAV ══════════════ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 3rem;height:64px;
  background:rgba(250,246,238,0.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(90,80,50,0.12);
  transition:background 0.4s,box-shadow 0.4s;
}
nav.scrolled{background:rgba(250,246,238,0.98);box-shadow:0 2px 24px rgba(0,0,0,0.07)}
.nav-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:1.6rem;font-weight:600;
  color:var(--oliva);letter-spacing:0.04em;
  text-decoration:none;
}
.nav-logo span{font-weight:300;font-style:italic;color:var(--tierra-claro)}
.nav-menu{display:flex;align-items:center;gap:2.5rem;list-style:none}
.nav-menu a{
  text-decoration:none;
  font-size:0.72rem;font-weight:500;
  letter-spacing:0.18em;text-transform:uppercase;
  color:var(--grafito);
  position:relative;padding-bottom:2px;
  transition:color 0.2s;
}
.nav-menu a::after{
  content:'';position:absolute;bottom:0;left:0;right:100%;
  height:1px;background:var(--oliva-med);
  transition:right 0.3s ease;
}
.nav-menu a:hover{color:var(--oliva)}
.nav-menu a:hover::after{right:0}
.nav-menu .bici-link{color:var(--naranja-bici)!important}
.nav-menu .bici-link::after{background:var(--naranja-bici)!important}

/* ══════════════ HERO ══════════════ */
.hero{
  position:relative;height:100vh;min-height:600px;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
}
.hero-media{
  position:absolute;inset:0;
  background:url('pueblo.jpg') center/cover no-repeat;
  transform:scale(1.05);
  transition:transform 8s ease;
}
.hero-media::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(
    165deg,
    rgba(18,16,10,0.15) 0%,
    rgba(18,16,10,0.08) 30%,
    rgba(18,16,10,0.62) 75%,
    rgba(18,16,10,0.82) 100%
  );
}
.hero.loaded .hero-media{transform:scale(1)}
.hero-content{
  position:relative;z-index:2;
  padding:0 4.5rem 4rem;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:flex-end;
  gap:2rem;
}
/* Grid interna para alinear el Logo principal y el texto */
.hero-main-layout {
  display: flex;
  align-items: center;
  gap: 3.5rem;
}
.hero-logo-main {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  flex-shrink: 0;
}
.hero-logo-main img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-left{}
.hero-tag{
  display:inline-flex;align-items:center;gap:0.6rem;
  font-size:0.68rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--tierra-claro);font-weight:500;
  margin-bottom:1.2rem;
}
.hero-tag::before{content:'';width:28px;height:1px;background:var(--tierra-claro)}
.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(5rem,10vw,9rem);
  font-weight:300;color:#fff;
  line-height:0.95;letter-spacing:-0.01em;
  margin-bottom:1.5rem;
}
.hero h1 em{font-style:italic;font-weight:300}
.hero-desc{
  font-size:1rem;color:rgba(255,255,255,0.72);
  font-weight:300;max-width:420px;line-height:1.7;
  margin-bottom:2rem;
}
.hero-cta{
  display:inline-flex;align-items:center;gap:0.8rem;
  text-decoration:none;
  font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;
  font-weight:500;color:#fff;
  border:1px solid rgba(255,255,255,0.5);
  padding:0.85rem 2.2rem;
  transition:background 0.3s,border-color 0.3s;
}
.hero-cta::after{content:'↓';font-size:0.9rem;letter-spacing:0}
.hero-cta:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.85)}
.hero-right{
  display:flex;flex-direction:column;align-items:flex-end;gap:1.5rem;
  padding-bottom:0.5rem;
}
.hero-stat{text-align:right}
.hero-stat-num{
  font-family:'Cormorant Garamond',serif;
  font-size:2.2rem;font-weight:300;color:#fff;
  line-height:1;display:block;
}
.hero-stat-lbl{
  font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;
  color:rgba(255,255,255,0.5);display:block;margin-top:0.2rem;
}
.hero-stat-divider{width:1px;height:32px;background:rgba(255,255,255,0.2)}

/* ══════════════ MARQUEE ══════════════ */
.marquee-strip{
  background:var(--oliva);
  overflow:hidden;white-space:nowrap;
  padding:0.85rem 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.marquee-inner{
  display:inline-flex;gap:3rem;
  animation:marquee 22s linear infinite;
}
.marquee-inner span{
  font-size:0.68rem;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(255,255,255,0.7);font-weight:500;
}
.marquee-inner span.dot{color:var(--oliva-claro);font-size:0.5rem}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ══════════════ SECCIONES BASE ══════════════ */
section{padding:7rem 4.5rem}
.container{max-width:1100px;margin:0 auto}
.label-tiny{
  font-size:0.68rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--oliva-med);font-weight:500;
  display:flex;align-items:center;gap:0.6rem;
  margin-bottom:0.8rem;
}
.label-tiny::before{content:'';width:22px;height:1px;background:var(--oliva-med)}
.section-h{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.2rem,4vw,3.6rem);
  font-weight:300;line-height:1.15;
  color:var(--carbon);
  margin-bottom:1.8rem;
}
.section-h em{font-style:italic;color:var(--oliva)}
.rule{width:52px;height:1.5px;background:var(--oliva-claro);margin-bottom:2.5rem}

/* ══════════════ INTRO ══════════════ */
#intro{background:var(--blanco)}
.intro-grid{
  display:grid;grid-template-columns:1.1fr 0.9fr;
  gap:6rem;align-items:center;
}
.intro-text p{color:var(--grafito);margin-bottom:1.2rem;font-size:1rem;line-height:1.85}
.intro-mosaic{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:160px 160px;
  gap:0.6rem;
}
.mosaic-a{grid-row:1/3;grid-column:1}
.mosaic-b{grid-row:1;grid-column:2}
.mosaic-c{grid-row:2;grid-column:2}
.mosaic-a,.mosaic-b,.mosaic-c{overflow:hidden}
.mosaic-a img,.mosaic-b img,.mosaic-c img{
  width:100%;height:100%;object-fit:cover;
  display:block;
  transition:transform 0.6s ease,filter 0.4s ease;
  filter:saturate(0.85);
}
.mosaic-a:hover img,.mosaic-b:hover img,.mosaic-c:hover img{
  transform:scale(1.06);filter:saturate(1.05);
}
.mosaic-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;
}
.stat-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:0;margin-top:4rem;
  border:1px solid rgba(90,80,50,0.12);
}
.stat-item{
  padding:1.8rem 1.5rem;
  border-right:1px solid rgba(90,80,50,0.12);
  position:relative;
  overflow:hidden;
  transition:background 0.3s;
}
.stat-item:last-child{border-right:none}
.stat-item::before{
  content:'';position:absolute;bottom:0;left:0;right:100%;height:2px;
  background:var(--oliva-med);transition:right 0.4s ease;
}
.stat-item:hover::before{right:0}
.stat-item:hover{background:var(--oliva-palido)}
.stat-n{
  font-family:'Cormorant Garamond',serif;
  font-size:2.6rem;font-weight:300;color:var(--oliva);
  line-height:1;display:block;margin-bottom:0.3rem;
}
.stat-l{
  font-size:0.65rem;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--ceniza);
}

/* ══════════════ HISTORIA ══════════════ */
#historia{background:var(--pergamino)}
.historia-wrap{
  display:grid;grid-template-columns:220px 1fr;
  gap:5rem;align-items:start;
}
.timeline{position:relative;padding-top:0.5rem}
.timeline::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:1px;background:linear-gradient(to bottom,var(--oliva-med),transparent);
}
.t-item{
  padding-left:1.8rem;margin-bottom:2.5rem;position:relative;
